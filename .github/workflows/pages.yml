# Publica la web de documentación, la librería y la app de ejemplo en GitHub Pages.
# Activa Pages en Settings → Pages → Source: "GitHub Actions".
name: Desplegar web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pruebas y build
        working-directory: diegofo-ui
        run: |
          npm install
          npm test
          npm run build
      - name: Montar el sitio
        run: |
          mkdir -p _site/diegofo-ui
          cp index.html _site/
          cp -r diegofo-ui/docs diegofo-ui/dist _site/diegofo-ui/
          cp -r app _site/app
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
